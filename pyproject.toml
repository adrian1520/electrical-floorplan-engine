[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "electrical-floorplan-engine"
version = "0.1.0"
description = "Deterministic tooling for electrical floorplan drafting and PDF export."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — project owner retains all rights" }
dependencies = [
  "reportlab>=4.1,<5",
  "pydantic>=2.6,<3",
]

[project.optional-dependencies]
image = [
  "opencv-python-headless>=4.9,<5",
  "Pillow>=10.2,<13",
]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.4,<1",
  "pypdf>=4.2,<6",
]

[project.scripts]
floorplan-engine = "electrical_floorplan_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
"src/electrical_floorplan_engine/calibration_ui.py" = ["E501"]
